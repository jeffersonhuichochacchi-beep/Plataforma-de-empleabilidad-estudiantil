spring.application.name=usuarios-service

server.port=8081

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/db_empleabilidad?currentSchema=schema_usuarios
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=schema_usuarios
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# JWT Secret
jwt.secret=my-super-secret-key-that-should-be-changed-in-production

storage.local.base-path=${STORAGE_LOCAL_BASE_PATH:${java.io.tmpdir}}
storage.cv.max-size-mb=${STORAGE_CV_MAX_SIZE_MB:5}
