spring.application.name=postulaciones-service

server.port=8083

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/db_empleabilidad?currentSchema=schema_postulaciones
spring.datasource.username=postgres
# IMPORTANTE: Reemplazar con la contrasena correcta
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=schema_postulaciones
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# JWT Secret
jwt.secret=my-super-secret-key-that-should-be-changed-in-production

# External Services URLs
usuarios.service.url=http://localhost:8081
ofertas.service.url=http://localhost:8082
